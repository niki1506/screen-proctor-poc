[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screenproctor-poc"
version = "0.4.4"
description = "Offline video proctoring with reviewable evidence"
requires-python = ">=3.11,<3.14"
dependencies = [
  "av>=14,<17", "numpy>=2,<3", "opencv-python>=4.10,<5",
  "rapidocr-onnxruntime==1.4.4", "onnxruntime==1.22.1",
  "ultralytics>=8.3,<9", "streamlit>=1.40,<2", "reportlab>=4.4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pypdf>=5,<7"]

[project.scripts]
screenproctor = "screenproctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
